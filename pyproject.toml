[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tierra-plus"
version = "0.1.0"
description = "Causal reliability experiments and analytic controls for spectral inverse models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Vectigen" },
]
keywords = [
  "astronomy",
  "bayesian-inference",
  "inverse-problems",
  "spectral-inference",
  "interpretability",
  "prior-shift",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
inference = ["dynesty>=3.0,<4.0"]
docs = [
  "myst-parser>=4.0.0,<5.0.0",
  "sphinx>=8.0.0,<9.0.0",
]

[project.scripts]
tierra-plus = "tierra_plus.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.11,<1.0",
  "black>=26.3.1,<27.0.0",
  "mypy>=1.11.0,<2.0.0",
  "myst-parser>=4.0.0,<5.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "sphinx>=8.0.0,<9.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.uv]
constraint-dependencies = [
  "idna>=3.15",
  "urllib3>=2.8.0",
  "virtualenv>=21.7.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=tierra_plus --cov-report=term-missing --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["tierra_plus"]

[tool.coverage.run]
branch = true
source = ["tierra_plus"]

[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.hatch.build.targets.wheel.force-include]
"data/public" = "tierra_plus/data/public"
